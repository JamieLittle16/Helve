name: R2C Official Heightmap Facts

on:
  pull_request:
    paths:
      - tools/official_r2c_heightmap_facts.py
      - tools/official_state_data.py
      - tools/r2c_heightmap_candidate_bytes.py
      - tools/r2c_heightmap_reproducibility.py
      - tools/tests/test_r2c_heightmap_reproducibility.py
      - tools/tests/test_official_r2c_heightmap_facts.py
      - tools/tests/test_r2c_heightmap_candidate_bytes.py
      - crates/helve-server/src/r2c_heightmap_facts.rs
      - crates/helve-server/src/r2c_section_candidate.rs
      - crates/helve-server/src/r2c_initial_view.rs
      - crates/helve-server/src/r2c_disk_first_view.rs
      - crates/helve-server/src/lib.rs
      - vanilla/vanilla.lock.toml
      - .github/workflows/r2c-official-heightmap-facts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    name: Exact official 26.2 heightmap state oracle (candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Hermetic heightmap oracle tests
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_official_r2c_heightmap_facts.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_r2c_heightmap_candidate_bytes.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_r2c_heightmap_reproducibility.py' -v

      - name: Probe official pinned server
        run: |
          python3 tools/official_r2c_heightmap_facts.py \
            --output /tmp/26.2-heightmap-state-facts-candidate.json

      - name: Independently repeat full 32366-state official runtime oracle
        run: |
          python3 tools/official_r2c_heightmap_facts.py \
            --output /tmp/26.2-heightmap-state-facts-repeat.json
          python3 tools/r2c_heightmap_reproducibility.py \
            --first /tmp/26.2-heightmap-state-facts-candidate.json \
            --repeat /tmp/26.2-heightmap-state-facts-repeat.json \
            --output /tmp/r2c-26.2-heightmap-runtime-repeat-audit.json
          rm /tmp/26.2-heightmap-state-facts-repeat.json

      - name: Independently gate second-run equality and source non-admission
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          first=json.loads(Path("/tmp/26.2-heightmap-state-facts-candidate.json").read_text())
          audit=json.loads(Path("/tmp/r2c-26.2-heightmap-runtime-repeat-audit.json").read_text())
          actual=bytes(first["flags_by_vanilla_state_id"])
          assert len(actual)==32366
          assert audit["reproduced_dense_state_fact_sha256"]==hashlib.sha256(actual).hexdigest()
          assert audit["official_independent_probe_runs"]==2
          assert audit["runtime_id_indexed_byte_equality"]
          assert len(audit["four_bit_histogram"])==16
          assert sum(audit["four_bit_histogram"])==32366
          for key in ("independent_semantic_source_review","source_var_sem_admitted",
                      "production_admitted"):
              assert audit[key] is False
          print("OFFICIAL HEIGHTMAP REPRODUCED:",
                audit["reproduced_dense_state_fact_sha256"])
          print("Counts:",audit["client_heightmap_state_predicate_counts"])
          print("Histogram:",audit["four_bit_histogram"])
          print("Independent semantic source admission still BLOCKED")
          PY

      - name: Fail closed on wrong identity or silent authority promotion
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          with Path("vanilla/vanilla.lock.toml").open("rb") as stream:
              lock = tomllib.load(stream)
          report = json.loads(Path("/tmp/26.2-heightmap-state-facts-candidate.json").read_text())
          assert report["server_sha256"] == lock["runtime"]["server_sha256"]
          assert report["source_archive_sha256"] == lock["source"]["archive_sha256"]
          assert report["state_count"] == 32366
          assert len(report["flags_by_vanilla_state_id"]) == 32366
          assert not report["source_admitted"]
          assert not report["production_admitted"]
          assert all(0 <= value <= 15 for value in report["flags_by_vanilla_state_id"])
          print("Official dense heightmap candidate PASS; production admission remains blocked")
          PY

      - name: Convert source-checked candidate to exact dense borrowed bytes
        run: |
          python3 tools/r2c_heightmap_candidate_bytes.py \
            --input /tmp/26.2-heightmap-state-facts-candidate.json \
            --output /tmp/26.2-heightmap-state-facts-candidate.bin

      - name: Independently cross-check official facts against generated Rust state data
        env:
          HELVE_R2C_HEIGHTMAP_CANDIDATE: /tmp/26.2-heightmap-state-facts-candidate.bin
        run: |
          cargo test --locked -p helve-server --lib \
            r2c_heightmap_facts::tests::official_runtime_candidate_feeds_real_source_heightmap_reference \
            -- --exact
          cargo test --locked -p helve-server --lib \
            r2c_section_candidate::tests::official_heightmap_facts_reach_receipt_bound_chunk_packet \
            -- --exact
          cargo test --locked -p helve-server --lib \
            r2c_disk_first_view::tests::source_chunks_from_two_disk_regions_feed_one_nearest_first_batch \
            -- --exact

      - name: Upload ephemeral source-free candidate facts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2c-26.2-official-heightmap-facts-candidate
          path: |
            /tmp/26.2-heightmap-state-facts-candidate.json
            /tmp/26.2-heightmap-state-facts-candidate.bin
            /tmp/r2c-26.2-heightmap-runtime-repeat-audit.json
          if-no-files-found: error
          retention-days: 7
