name: R2C Official Biome Registry Probe

on:
  pull_request:
    paths:
      - tools/official_biome_registry.py
      - tools/tests/test_official_biome_registry.py
      - vanilla/vanilla.lock.toml
      - .github/workflows/r2c-official-biome-registry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official_biome_registry:
    name: Official 26.2 biome protocol ID ordering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Test fail-closed registry report parser
        run: python3 -m unittest discover -s tools/tests -p 'test_official_biome_registry.py' -v

      - name: Extract source-ordered IDs from pinned official Mojang server reports
        run: |
          python3 tools/official_biome_registry.py \
            --version 26.2 \
            --cache /tmp/helve-vanilla-downloads \
            --work-dir /tmp/r2c-official-biome-datagen \
            --output /tmp/26.2-official-biome-ids.json \
            --print-ids

      - name: Verify source identity and canonical ID continuity
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import tomllib
          from pathlib import Path
          data = json.loads(Path('/tmp/26.2-official-biome-ids.json').read_text())
          lock = tomllib.loads(Path('vanilla/vanilla.lock.toml').read_text())
          assert data['target'] == {
              'minecraft_version': '26.2',
              'protocol_version': 776,
              'data_version': 4903,
          }
          assert data['server_sha256'] == lock['runtime']['server_sha256']
          names = data['names_by_protocol_id']
          assert data['registry_count'] == len(names) > 0
          assert len(set(names)) == len(names)
          assert hashlib.sha256(('\n'.join(names) + '\n').encode()).hexdigest() == data['source_order_sha256']
          print(f"source-bound biome ID-map: {len(names)} exact IDs")
          PY
