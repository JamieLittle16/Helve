name: Worldgen Parity and Benchmark Qualification

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/world/helve-world-gen/**"
      - "tools/worldgen_noise_oracle.py"
      - "tools/tests/test_worldgen_noise_oracle.py"
      - "tools/worldgen_26_2_improved_noise_capture.py"
      - "tools/tests/test_worldgen_26_2_improved_noise_capture.py"
      - "tools/worldgen_26_2_noise_family_frontier.py"
      - "tools/tests/test_worldgen_26_2_noise_family_frontier.py"
      - "tools/worldgen_26_2_perlin_normal_capture.py"
      - "tools/tests/test_worldgen_26_2_perlin_normal_capture.py"
      - "tools/worldgen_26_2_noise_constructor_state_capture.py"
      - "tools/tests/test_worldgen_26_2_noise_constructor_state_capture.py"
      - "tools/worldgen_26_2_density_primitive_capture.py"
      - "tools/tests/test_worldgen_26_2_density_primitive_capture.py"
      - "tools/worldgen_26_2_density_composition_capture.py"
      - "tools/tests/test_worldgen_26_2_density_composition_capture.py"
      - "tools/worldgen_26_2_density_delegate_frontier.py"
      - "tools/tests/test_worldgen_26_2_density_delegate_frontier.py"
      - "tools/worldgen_26_2_noise_density_direct_capture.py"
      - "tools/tests/test_worldgen_26_2_noise_density_direct_capture.py"
      - "tools/worldgen_26_2_random_state_binding_frontier.py"
      - "tools/tests/test_worldgen_26_2_random_state_binding_frontier.py"
      - "tools/worldgen_26_2_world_seed_density_capture.py"
      - "tools/tests/test_worldgen_26_2_world_seed_density_capture.py"
      - "tools/worldgen_26_2_stock_worldseed_fixture.py"
      - "tools/tests/test_worldgen_26_2_stock_worldseed_fixture.py"
      - "vanilla/reports/worldgen-26_2-stock-worldseed-noise-bits-01.txt"
      - "tools/worldgen_java/HelveWorldSeededDensity262.java"
      - "tools/tests/test_worldgen_26_2_family_frozen_vectors.py"
      - "vanilla/reports/worldgen-26_2-family-raw-bit-oracle-01.json"
      - "docs/architecture/WORLDGEN_BIT_PARITY_BENCHMARK.md"
      - ".github/workflows/worldgen-parity-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "crates/world/helve-world-gen/**"
      - "tools/worldgen_noise_oracle.py"
      - "tools/tests/test_worldgen_noise_oracle.py"
      - "tools/worldgen_26_2_improved_noise_capture.py"
      - "tools/tests/test_worldgen_26_2_improved_noise_capture.py"
      - "tools/worldgen_26_2_noise_family_frontier.py"
      - "tools/tests/test_worldgen_26_2_noise_family_frontier.py"
      - "tools/worldgen_26_2_perlin_normal_capture.py"
      - "tools/tests/test_worldgen_26_2_perlin_normal_capture.py"
      - "tools/worldgen_26_2_noise_constructor_state_capture.py"
      - "tools/tests/test_worldgen_26_2_noise_constructor_state_capture.py"
      - "tools/worldgen_26_2_density_primitive_capture.py"
      - "tools/tests/test_worldgen_26_2_density_primitive_capture.py"
      - "tools/worldgen_26_2_density_composition_capture.py"
      - "tools/tests/test_worldgen_26_2_density_composition_capture.py"
      - "tools/worldgen_26_2_density_delegate_frontier.py"
      - "tools/tests/test_worldgen_26_2_density_delegate_frontier.py"
      - "tools/worldgen_26_2_noise_density_direct_capture.py"
      - "tools/tests/test_worldgen_26_2_noise_density_direct_capture.py"
      - "tools/worldgen_26_2_random_state_binding_frontier.py"
      - "tools/tests/test_worldgen_26_2_random_state_binding_frontier.py"
      - "tools/worldgen_26_2_world_seed_density_capture.py"
      - "tools/tests/test_worldgen_26_2_world_seed_density_capture.py"
      - "tools/worldgen_26_2_stock_worldseed_fixture.py"
      - "tools/tests/test_worldgen_26_2_stock_worldseed_fixture.py"
      - "vanilla/reports/worldgen-26_2-stock-worldseed-noise-bits-01.txt"
      - "tools/worldgen_java/HelveWorldSeededDensity262.java"
      - "tools/tests/test_worldgen_26_2_family_frozen_vectors.py"
      - "vanilla/reports/worldgen-26_2-family-raw-bit-oracle-01.json"
      - ".github/workflows/worldgen-parity-benchmark.yml"
  workflow_dispatch:

concurrency:
  group: worldgen-parity-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: Worldgen strict-oracle format and whole-cost smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Format targeted worldgen crate
        run: cargo fmt --package helve-world-gen -- --check

      - name: Strict Clippy including bench target
        run: cargo clippy --package helve-world-gen --all-targets --all-features --locked -- -D warnings

      - name: Worldgen semantic tests and 160 direct official bit vectors (debug)
        run: cargo test --package helve-world-gen --locked

      - name: Raw 26.2 oracle and coherent-plane/scalar bit parity in optimised release
        run: cargo test --release --locked -p helve-world-gen --tests

      - name: Source-free raw IEEE oracle contract mutation tests
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_noise_oracle.py' -v

      # Compile a synthetic original Java stub: no Mojang source, jar or
      # extracted production code enters a hosted CI job.
      - name: Verify official-runtime capture transport against independent synthetic Java
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_improved_noise_capture.py' -v

      - name: Source-free pinned 26.2 Perlin/Normal/density family Atlas boundary tests
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_noise_family_frontier.py' -v

      - name: Exact 26.2 Perlin/Normal output-capture contract with original toy JVM
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_perlin_normal_capture.py' -v

      - name: Exact 26.2 private numeric state capture against independent toy JVM
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_noise_constructor_state_capture.py' -v

      - name: Validate 26.2 density primitive capture against independent synthetic JVM
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_density_primitive_capture.py' -v

      - name: Validate source-locked 26.2 density composition candidate against original synthetic JVM
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_density_composition_capture.py' -v

      - name: Validate official density delegate class discovery against independent toy JVM
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_density_delegate_frontier.py' -v

      - name: Validate direct-seeded 26.2 Noise.compute capture protocol with independent toy JVM
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_noise_density_direct_capture.py' -v

      - name: Validate 26.2 world-seed RandomState binding frontier against independent toy JVM
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_random_state_binding_frontier.py' -v

      - name: Validate 26.2 stock registry worldseed density oracle against independent toy JVM
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_world_seed_density_capture.py' -v

      - name: Verify SHA-pinned 1,440 official stock world-seed reference vectors (not Rust parity)
        run: |
          python3 tools/worldgen_26_2_stock_worldseed_fixture.py
          python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_stock_worldseed_fixture.py' -v

      - name: Validate all 320 source-free official Perlin/Normal raw-bit reference values
        run: python3 -m unittest discover -s tools/tests -p 'test_worldgen_26_2_family_frozen_vectors.py' -v

      # Hosted CPU timing only confirms the harness runs. No performance claim
      # or speed threshold may be derived from GitHub's shared runner.
      - name: Record tiny whole-cost diagnostic
        run: |
          mkdir -p target/helve-qualification/worldgen
          cargo bench --locked -p helve-world-gen --bench worldgen_cold -- \
            --chunks 2 --warmup 1 --rounds 2 \
            --output "${GITHUB_WORKSPACE}/target/helve-qualification/worldgen/smoke.json"

      - name: Measure raw-bit-validated candidate scalar noise micro-kernel
        run: |
          cargo bench --locked -p helve-world-gen --bench improved_noise_262 -- \
            --points 256 --warmup 1 --rounds 3 \
            --output "${GITHUB_WORKSPACE}/target/helve-qualification/worldgen/improved-noise-smoke.json"

      - name: Validate isolated 26.2 kernel workload structure (diagnostic timings only)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("target/helve-qualification/worldgen/improved-noise-smoke.json").read_text())
          assert a["schema"] == 1
          assert a["benchmark"] == "improved-noise-26_2-candidate"
          assert a["target_stage"] == "improved_noise"
          assert a["official_26_2_sample_vectors_tested_in_separate_ci"] == 160
          assert a["strict_floating_point"] is True
          assert a["full_worldgen_source_admitted"] is False
          assert a["full_chunk_latency_measured"] is False
          assert a["points_per_round"] == 256
          assert a["measured_rounds"] == 3
          assert a["timing_units"] == "ns_per_batch"
          assert len(a["cases"]) == 6
          assert {c["name"] for c in a["cases"]} == {
              "immutable_seed_setup", "coherent_grid_scalar",
              "coherent_grid_reused", "scattered_scalar",
              "explicit_4layer_scalar", "explicit_4layer_batched"
          }
          for case in a["cases"]:
              assert case["batches"] == 3
              assert case["evaluations_per_batch"] > 0
              assert 0 < case["p50_ns"] <= case["p95_ns"] <= case["p99_ns"] <= case["max_ns"]
          cases = {c["name"]: c for c in a["cases"]}
          assert cases["coherent_grid_scalar"]["evaluations_per_batch"] == 256
          assert cases["coherent_grid_reused"]["evaluations_per_batch"] == 256
          assert cases["coherent_grid_scalar"]["checksum"] == cases["coherent_grid_reused"]["checksum"]
          assert cases["explicit_4layer_scalar"]["evaluations_per_batch"] == 256
          assert cases["explicit_4layer_batched"]["evaluations_per_batch"] == 256
          assert cases["explicit_4layer_scalar"]["checksum"] == cases["explicit_4layer_batched"]["checksum"]
          print("coherent scalar/reused whole-grid bit checksum PASS; timings diagnostic only")
          PY

      - name: Validate structural benchmark artifact, not elapsed-time thresholds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("target/helve-qualification/worldgen/smoke.json").read_text())
          assert a["schema"] == 1
          assert a["type"] == "NON_VANILLA_STEPPED_SURFACE_BASELINE"
          assert a["strict_minecraft_26_2_parity"] is False
          assert a["worldgen_noise_26_2_measured"] is False
          assert a["sections"] == 24
          assert a["chunks_per_round"] == 2
          assert a["measured_rounds"] == 2
          assert a["units"] == "ns"
          assert a["provenance"]["commit_sha"]
          assert len(a["cases"]) == 3
          expected = {
              "256_column_samples",
              "sample_and_construct_sections",
              "sample_construct_and_resident_install",
          }
          assert {c["name"] for c in a["cases"]} == expected
          for case in a["cases"]:
              assert case["samples"] == 4
              assert 0 < case["p50_ns"] <= case["p95_ns"] <= case["p99_ns"] <= case["max_ns"]
              assert case["total_sample_ns"] > 0
          print("Worldgen diagnostic structure green; no source parity or speed assertion")
          PY

      - name: Upload source-free diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helve-worldgen-cold-diagnostic
          path: target/helve-qualification/worldgen/*.json
          if-no-files-found: error
          retention-days: 7
