name: R2C Official Client Protocol Builder Frontier

on:
  pull_request:
    paths:
      - tools/r2c_client_packet_builder_frontier.py
      - tools/tests/test_r2c_client_packet_builder_frontier.py
      - tools/r2c_official_client_registry_inventory.py
      - tools/official_state_data.py
      - vanilla/vanilla.lock.toml
      - .github/workflows/r2c-official-client-protocol-builder.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder:
    name: Exact official 26.2 client packet type to numeric ID implementation (unadmitted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Java 25 for official 26.2 unobfuscated client
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Synthetic fail-closed method, branch, and evidence tests
        run: python3 -m unittest discover -s tools/tests -p 'test_r2c_client_packet_builder_frontier.py' -v

      - name: Inspect official ProtocolInfoBuilder class and nested implementation
        run: |
          python3 tools/r2c_client_packet_builder_frontier.py \
            --output /tmp/r2c-client-protocol-builder-frontier.json

      - name: Require exact target and explicit non-admission
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          item=json.loads(Path("/tmp/r2c-client-protocol-builder-frontier.json").read_text())
          assert item["target"] == {
              "minecraft":"26.2", "protocol":776, "data_version":4903
          }
          for field in ("builder_append_to_numeric_id_law_proven",
                        "bundle_numeric_id_effect_proven",
                        "serverbound_clientbound_direction_law_proven",
                        "independent_source_var_sem_admitted","production_admitted"):
              assert item[field] is False
          records=item["builder_class_candidates"]
          assert 1 <= len(records) <= 24
          assert records[0]["class_name"] == (
              "net.minecraft.network.protocol.ProtocolInfoBuilder"
          )
          assert any(record["method_name"]=="addPacket"
                     for cls in records for record in cls["selected_methods"])
          # Source-free actual SHA/size-checked Mojang 26.2 classes.
          # Explicitly independently pinned: these are NOT derived from
          # the collection code's own constants.
          class_sha={
              "net.minecraft.network.protocol.ProtocolInfoBuilder":
                  "7af68e5a84feaa5c7b4f2c6bff09e8ee2b8f679256624419428c774cf88e8bde",
              "net.minecraft.network.protocol.ProtocolInfoBuilder$1":
                  "68eb1b383c38b9d4a0fd805dc12dad7b1f725508f69f0d76c653733661cec3a1",
              "net.minecraft.network.protocol.ProtocolInfoBuilder$2":
                  "8e648dfd4d2ae1878f158706ca6ba80ee2ed3079795fffa57ac08a6ac7238ae0",
              "net.minecraft.network.protocol.ProtocolInfoBuilder$3":
                  "a8cc3068a41690a0f5e391ffc9453d549eb95c327e4f0f1d40099f59c9f68fc9",
              "net.minecraft.network.protocol.ProtocolInfoBuilder$CodecEntry":
                  "e7b2d2a0c881cd720cb15e122cabb10c49d9f7bc4e1533ec0f4f8dba5f3e8c2b",
              "net.minecraft.network.protocol.ProtocolInfoBuilder$Implementation":
                  "5f2f863fe918a43823ba29b9e37ff372dd8efd2e153b9471d5d6270a338b2549",
          }
          assert {cls["class_name"]:cls["classfile_sha256"] for cls in records}==class_sha
          root=records[0]
          assert [m["method_name"] for m in root["selected_methods"]]==[
              "addPacket","addPacket","withBundlePacket",
          ]
          assert [
              (m["instruction_count"],m["instruction_shape_sha256"])
              for m in root["selected_methods"]
          ]==[
              (12,"f1a20e916c0dcd8c3f321e42e2aab8fd6a56300f1cb1177fb3a53a9271017a27"),
              (12,"1cd95818ae419881c72f65e3a9d584aec38a8a10cf804a8d22423a866c7dbaa"),
              (24,"01a8b43ca46c5e92a17c40aaff795558fe63820bbf55750a862723d52caf41fe"),
          ]
          for method in root["selected_methods"][:2]:
              assert [
                  (edge["bytecode_offset"],edge["opcode"])
                  for edge in method["symbolic_edges_candidate"]
              ] == [(1,"getfield"),(4,"new"),(11,"invokespecial"),(14,"invokeinterface")]
              assert [
                  fragment in edge["symbol_candidate"]
                  for edge,fragment in zip(method["symbolic_edges_candidate"],
                    ["Field codecs:","ProtocolInfoBuilder$CodecEntry",
                     "ProtocolInfoBuilder$CodecEntry", "List.add:"])
              ] == [True]*4
          bundle=root["selected_methods"][2]
          assert [(edge["bytecode_offset"],edge["opcode"])
                  for edge in bundle["symbolic_edges_candidate"]] == [
                      (1,"invokestatic"),(7,"invokevirtual"),
                      (13,"getfield"),(16,"new"),(25,"invokespecial"),
                      (28,"invokeinterface"),(38,"invokestatic"),
                      (41,"putfield"),
                  ]
          assert "List.add:" in bundle["symbolic_edges_candidate"][5]["symbol_candidate"]
          for cls in records:
              assert cls["builder_numeric_id_assignment_proven"] is False
              assert len(cls["classfile_sha256"])==64
              print("Stock client builder class:",cls["class_name"],cls["classfile_sha256"])
              for m in cls["selected_methods"]:
                  print(" method:",m["method_name"],"count",m["instruction_count"],
                        "shape",m["instruction_shape_sha256"],
                        "abstract",m["abstract_or_native_no_bytecode"])
                  for edge in m["symbolic_edges_candidate"]:
                      print("  ",edge["bytecode_offset"],edge["opcode"],
                            edge["symbol_candidate"])
          print("Builder implementation candidates inspected; numeric IDs not admitted")
          PY

      - name: Upload source-free, short-lived method identities only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2c-26.2-client-protocol-builder-candidates
          path: /tmp/r2c-client-protocol-builder-frontier.json
          retention-days: 7
          if-no-files-found: error
