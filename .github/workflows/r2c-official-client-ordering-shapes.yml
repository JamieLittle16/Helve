name: R2C Official Client Ordering Method Shapes

on:
  pull_request:
    paths:
      - tools/r2c_client_order_semantic_frontier.py
      - tools/tests/test_r2c_client_order_semantic_frontier.py
      - tools/tests/R2cClientSequenceJdkOracle.java
      - tools/r2c_official_client_registry_inventory.py
      - tools/official_state_data.py
      - vanilla/vanilla.lock.toml
      - .github/workflows/r2c-official-client-ordering-shapes.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordering:
    name: Source-free official 26.2 client ordered-registration branch inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Java 25 for exact unobfuscated client method evidence
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: JDK 25 ordering and exceptional-completion control oracle
        run: |
          mkdir -p /tmp/r2c-client-order-jdk
          javac -d /tmp/r2c-client-order-jdk tools/tests/R2cClientSequenceJdkOracle.java
          java -cp /tmp/r2c-client-order-jdk R2cClientSequenceJdkOracle

      - name: Hermetic malicious-branch and order-violation tests
        run: python3 -m unittest discover -s tools/tests -p 'test_r2c_client_order_semantic_frontier.py' -v

      - name: Inspect exact official 26.2 client ordered-registration bytecode
        run: |
          python3 tools/r2c_client_order_semantic_frontier.py \
            --output /tmp/r2c-26.2-official-client-order-branch-candidates.json

      - name: Fail closed on semantic and production authority
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(
              Path("/tmp/r2c-26.2-official-client-order-branch-candidates.json").read_text()
          )
          assert evidence["target"] == {"minecraft":"26.2","protocol":776,"data_version":4903}
          assert not evidence["complete_semantic_review"]
          assert not evidence["client_numeric_id_assignment_proven"]
          assert not evidence["source_var_sem_admitted"]
          assert not evidence["production_admitted"]
          methods = evidence["review_method_shapes"]
          assert len(methods) == 7
          # Independent, exact stock 26.2 method-code fingerprints observed
          # on the Mojang SHA/size-checked client. Change requires new
          # semantic review, not a silently regenerated digest.
          fingerprints = {
              ("net.minecraft.client.multiplayer.RegistryDataCollector$ContentsCollector", "append"):
                  ("a916750de199b35bbdbcbf6c3516f9753a318c1341277c18e2722e536f04880f", 10),
              ("net.minecraft.resources.NetworkRegistryLoadTask", "load"):
                  ("8c30f1dd27891927fed0bd2b61e31441761fbf118083bf6e30232063e48fcbdf", 84),
              ("net.minecraft.resources.NetworkRegistryLoadTask", "lambda$load$2"):
                  ("3d426be2f28fe1eaaedd2297a511bb6a34ae8cab92c80a5a649f37c2001097a6", 14),
              ("net.minecraft.util.Util", "sequence"):
                  ("f4e5055aa9b4908703db727f2b121b8cfc388a0d9ab54d777174f707b7746236", 28),
              ("net.minecraft.util.Util", "lambda$sequence$0"):
                  ("43b1b1094c7b3c27081d7218fa80da26a2ff0f6f8dca8dc0745900b7ac0a6348", 6),
              ("net.minecraft.resources.RegistryLoadTask", "registerElements"):
                  ("81818ebc5666b4817e914364c3797112c45c558173e6d95afc003cad109a3197", 21),
              ("net.minecraft.core.MappedRegistry", "register"):
                  ("64a2dcaac37de02425535021b5c37f2fd4081e2e7db695be3c00766989f52840", 119),
          }
          assert len(fingerprints) == len(methods)
          for record in methods:
              key = record["class_name"], record["method_name"]
              expected_hash, expected_count = fingerprints[key]
              assert record["instruction_shape_sha256"] == expected_hash, key
              assert record["instruction_count"] == expected_count, key
          method_map = {
              (m["class_name"], m["method_name"]): m for m in methods
          }
          def branch_edges(cls, name):
              return [(edge["from"], edge["opcode"], edge["to"])
                      for edge in method_map[(cls, name)]["conditional_branch_edges"]]
          assert branch_edges("net.minecraft.util.Util", "sequence") == [
              (6, "ifeq", 16), (23, "if_icmpne", 44)
          ]
          assert method_map[("net.minecraft.util.Util", "sequence")]["return_instruction_offsets"] == [
              15, 43, 71
          ]
          sequence_paths = method_map[("net.minecraft.util.Util", "sequence")][
              "util_sequence_three_normal_branch_witness"
          ]
          operand_proof = method_map[("net.minecraft.util.Util", "sequence")][
              "util_sequence_branch_operand_witness"
          ]
          assert operand_proof == [
              {
                  "branch_offset": 6,
                  "branch_opcode": "ifeq",
                  "receiver_opcode": "aload_0",
                  "producer_offset": 1,
                  "producer_symbol": "List.isEmpty:()Z",
                  "jvm_target_condition": "isEmpty_false",
                  "jvm_fallthrough_condition": "isEmpty_true",
              },
              {
                  "branch_offset": 23,
                  "branch_opcode": "if_icmpne",
                  "receiver_opcode": "aload_0",
                  "producer_offset": 17,
                  "producer_symbol": "List.size:()I",
                  "comparison_opcode": "iconst_1",
                  "jvm_target_condition": "size_not_equal_one",
                  "jvm_fallthrough_condition": "size_equal_one",
              },
          ]
          assert all(
              m["util_sequence_branch_operand_witness"] is None for m in methods
              if (m["class_name"], m["method_name"]) !=
                 ("net.minecraft.util.Util", "sequence")
          )
          assert [path["return_offset"] for path in sequence_paths] == [15, 43, 71]
          assert [path["conditional_choices"] for path in sequence_paths] == [
              [{"branch_offset": 6, "arm": "fallthrough"}],
              [{"branch_offset": 6, "arm": "target"},
               {"branch_offset": 23, "arm": "fallthrough"}],
              [{"branch_offset": 6, "arm": "target"},
               {"branch_offset": 23, "arm": "target"}],
          ]
          assert [path["ordered_critical_invokes"] for path in sequence_paths] == [
              ["List.isEmpty:"],
              ["List.isEmpty:", "List.size:", "CompletableFuture.thenApply:"],
              ["List.isEmpty:", "List.size:", "CompletableFuture.allOf:",
               "CompletableFuture.thenApply:"],
          ]
          # Exact source-verified critical invocation counts, including the
          # singleton thenApply, must not acquire extra calls silently.
          print("Official Util.sequence critical calls by normal return:", [
              (path["return_offset"], path["ordered_critical_invokes"])
              for path in sequence_paths
          ])
          assert all(
              record["util_sequence_three_normal_branch_witness"] is None
              for record in methods
              if (record["class_name"], record["method_name"]) !=
                 ("net.minecraft.util.Util", "sequence")
          )
          assert branch_edges("net.minecraft.resources.NetworkRegistryLoadTask", "load") == [
              (18, "ifnonnull", 26),
              (89, "ifeq", 187),
              (130, "ifeq", 160),
              (157, "goto", 184),
              (184, "goto", 82),
          ]
          assert branch_edges("net.minecraft.core.MappedRegistry", "register") == [
              (28, "ifeq", 54),
              (64, "ifeq", 90),
              (94, "ifnull", 147),
              (114, "ifnonnull", 138),
              (144, "goto", 168),
          ]
          handlers = method_map[
              ("net.minecraft.resources.RegistryLoadTask", "registerElements")
          ]["register_elements_exception_table_witness"]
          assert handlers["rollback_or_partial_mutation_semantics_proven"] is False
          assert handlers["stream_foreach_offset"] == 14
          assert handlers["stream_foreach_directly_covered_by_handler"] is True
          assert handlers["jvm_exception_handlers"] == [
              {"from": 7, "to_exclusive": 26, "target": 29,
               "catch_type": "any", "handler_opcode": "astore_3"},
              {"from": 29, "to_exclusive": 32, "target": 29,
               "catch_type": "any", "handler_opcode": "astore_3"},
          ]
          assert handlers["bounded_invoke_sites"] == [
              {
                  "offset": 9, "opcode": "invokedynamic",
                  "protected_by_handler_targets": [29],
                  "symbol": "InvokeDynamic #0:accept:(Lnet/minecraft/resources/RegistryLoadTask;)Ljava/util/function/Consumer;",
              },
              {
                  "offset": 14, "opcode": "invokeinterface",
                  "protected_by_handler_targets": [29],
                  "symbol": "InterfaceMethod java/util/stream/Stream.forEach:(Ljava/util/function/Consumer;)V",
              },
          ]
          assert handlers["monitor_sites"] == [
              {"offset": 6, "opcode": "monitorenter"},
              {"offset": 25, "opcode": "monitorexit"},
              {"offset": 31, "opcode": "monitorexit"},
          ]
          print("Official registerElements bounded invocation coverage:",
                handlers["bounded_invoke_sites"])
          print("Official registerElements JVM monitor events:",
                handlers["monitor_sites"])
          assert method_map[
              ("net.minecraft.resources.RegistryLoadTask", "registerElements")
          ]["return_instruction_offsets"] == [33, 34]
          assert all(
              row["register_elements_exception_table_witness"] is None
              for row in methods if (row["class_name"], row["method_name"])
              != ("net.minecraft.resources.RegistryLoadTask", "registerElements")
          )
          print("Official registerElements handler boundaries:", handlers)
          assert method_map[("net.minecraft.core.MappedRegistry", "register")]["return_instruction_offsets"] == [
              53, 89, 137, 275
          ]
          registry_terminal = method_map[
              ("net.minecraft.core.MappedRegistry", "register")
          ]["mapped_registry_terminal_path_witness"]
          assert [(row["exit_offset"], row["exit_opcode"]) for row in registry_terminal] == [
              (53, "athrow"), (89, "athrow"), (137, "athrow"), (275, "areturn"),
          ]
          assert all(not row["normal_return"] and
                     not row["critical_invokes_before_exit"]
                     for row in registry_terminal[:-1])
          assert registry_terminal[-1]["normal_return"]
          assert registry_terminal[-1]["critical_invokes_before_exit"] == [
              "ObjectList.size:", "ObjectList.add:", "Reference2IntMap.put:",
          ]
          assert all(
              method["mapped_registry_terminal_path_witness"] is None
              for method in methods if (method["class_name"], method["method_name"])
              != ("net.minecraft.core.MappedRegistry", "register")
          )

          for record in methods:
              assert record["ordered_callsite_witness_matches"]
              assert record["single_normal_return_cfg_path_through_all_calls"]
              assert record["exception_handler_and_dataflow_semantics_unreviewed"]
              assert not record["all_control_flow_paths_reviewed"]
              assert not record["exception_and_duplicate_semantics_proven"]
              assert len(record["conditional_branch_edges"]) <= 96
              assert record["instruction_count"] <= 512
              print(record["class_name"] + "#" + record["method_name"],
                    "instructions", record["instruction_count"],
                    "digest", record["instruction_shape_sha256"],
                    "branch edges", record["conditional_branch_edges"],
                    "exits", record["return_instruction_offsets"])
              print(" exact ordered checkpoints:", [
                  (edge["offset"], edge["expected_symbol"])
                  for edge in record["required_ordered_invoke_checkpoints"]
              ])
          print("Method shapes fingerprinted, NOT independently source admitted")
          PY

      - name: Upload short-lived source-free method shape evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2c-26.2-official-client-order-branch-candidates
          path: /tmp/r2c-26.2-official-client-order-branch-candidates.json
          if-no-files-found: error
          retention-days: 7
