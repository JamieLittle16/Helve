name: R2C Official Client Registry Discovery

on:
  pull_request:
    paths:
      - tools/r2c_official_client_registry_inventory.py
      - tools/tests/test_r2c_official_client_registry_inventory.py
      - tools/official_state_data.py
      - vanilla/vanilla.lock.toml
      - .github/workflows/r2c-official-client-registry-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Exact official 26.2 client receiver artifact discovery (unadmitted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Java 25 for unobfuscated class declaration inspection
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Hermetic receiver/metadata negative tests
        run: python3 -m unittest discover -s tools/tests -p 'test_r2c_official_client_registry_inventory.py' -v

      - name: Fetch official unobfuscated client into disposable scratch
        run: |
          python3 tools/r2c_official_client_registry_inventory.py \
            --output /tmp/r2c-26.2-client-registry-discovery.json

      - name: Gate every authority claim to false
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/r2c-26.2-client-registry-discovery.json").read_text())
          assert result["target"] == {"minecraft": "26.2", "protocol": 776, "data_version": 4903}
          assert not result["source_inspected"]
          assert not result["client_handler_invocation_proven"]
          assert not result["client_numeric_id_assignment_proven"]
          assert not result["production_admitted"]
          assert len(result["client_configuration_listener_candidates"]) <= 16
          assert result["official_executable_unobfuscated"]
          assert result["client_artifact"]["official_size_bytes"] > 0
          inner = result["client_inner_contents_candidate"]
          assert inner["class_name"] == "net.minecraft.client.multiplayer.RegistryDataCollector$ContentsCollector"
          assert inner["registry_loader_class_name"] == "net.minecraft.resources.RegistryDataLoader"
          assert len(inner["append_invoke_sites_candidate"]) == 1
          assert inner["append_invoke_sites_candidate"][0]["handler"] == "append"
          collector = result["client_registry_collector_candidate"]
          assert collector["class_name"] == "net.minecraft.client.multiplayer.RegistryDataCollector"
          assert len(collector["method_call_sites_candidate"]) <= 32
          assert any(m["handler"] == "appendContents" and m["invocations"]
                     for m in collector["method_call_sites_candidate"])
          listeners = [candidate for candidate in result["client_configuration_listener_candidates"]
                       if candidate["class_name"].endswith(".ClientConfigurationPacketListenerImpl")]
          assert len(listeners) == 1
          handlers = listeners[0]["client_handler_invoke_sites_candidate"]
          assert any(h["handler"] == "handleRegistryData" and h["invocations"] for h in handlers)
          assert all(len(h["invocations"]) <= 96 for h in handlers)
          print("Official unobfuscated client JAR/class SHA-256 candidates discovered, NOT ADMITTED")
          for candidate in result["client_configuration_listener_candidates"]:
              print(candidate["class_name"], candidate["registry_related_method_names"])
              for handler in candidate["client_handler_invoke_sites_candidate"]:
                  print("  handler:", handler["handler"], "invoke sites:", len(handler["invocations"]))
                  for edge in handler["invocations"]:
                      print("   ", edge["bytecode_offset"], edge["opcode"], edge["symbolic_target"])
          collector = result["client_registry_collector_candidate"]
          print("  receiver-reached collector:", collector["class_name"])
          for method in collector["method_call_sites_candidate"]:
              print("    collector method:", method["handler"], "invoke sites:", len(method["invocations"]))
              for edge in method["invocations"]:
                  print("     ", edge["bytecode_offset"], edge["opcode"], edge["symbolic_target"])
          inner = result["client_inner_contents_candidate"]
          print("  inner contents:", inner["class_name"])
          print("  loader identity:", inner["registry_loader_class_name"])
          for method in inner["append_invoke_sites_candidate"]:
              print("    inner append method:", method["handler"])
              for edge in method["invocations"]:
                  print("     ", edge["bytecode_offset"], edge["opcode"], edge["symbolic_target"])
          PY

      - name: Upload only bounded source-free review metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2c-26.2-official-client-receiver-candidate
          path: /tmp/r2c-26.2-client-registry-discovery.json
          if-no-files-found: error
          retention-days: 7
