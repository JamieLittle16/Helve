name: R2C Loaded Biome Registry Observation

on:
  pull_request:
    paths:
      - tools/r2c_live_biome_registry.py
      - tools/r2c_biome_registry_capture.py
      - tools/tests/test_r2c_live_biome_registry.py
      - vanilla/fixtures/world/26.2-official-biome-resource-keys.txt
      - vanilla/vanilla.lock.toml
      - .github/workflows/r2c-loaded-biome-registry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loaded_registry:
    name: Official 26.2 loaded Configuration biome ordinals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Test bounded Configuration negotiation and fail-closed parser
        run: python3 -m unittest discover -s tools/tests -p 'test_r2c_live_biome_registry.py' -v

      - name: Observe the genuinely loaded official server registry in Configuration
        run: |
          python3 tools/r2c_live_biome_registry.py \
            --cache /tmp/helve-vanilla-downloads \
            --work-dir /tmp/helve-live-biome-world \
            --output /tmp/26.2-loaded-biomes-unqualified.json

      - name: Verify source-free runtime evidence remains unadmitted
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import tomllib
          from pathlib import Path

          output = json.loads(Path('/tmp/26.2-loaded-biomes-unqualified.json').read_text())
          lock = tomllib.loads(Path('vanilla/vanilla.lock.toml').read_text())
          keys = Path('vanilla/fixtures/world/26.2-official-biome-resource-keys.txt').read_text().splitlines()
          observed = output['names_by_observed_network_ordinal']
          assert output['target'] == {'minecraft': '26.2', 'protocol': 776, 'data_version': 4903}
          assert output['known_packs'] == ['minecraft:core@26.2']
          assert output['server_sha256'] == lock['runtime']['server_sha256']
          assert output['source_archive_sha256'] == lock['source']['archive_sha256']
          assert output['registry'] == 'minecraft:worldgen/biome'
          assert output['numeric_id_authority'] == 'RUNTIME_OBSERVED_SOURCE_ADMISSION_PENDING'
          assert len(observed) == output['network_entry_count'] == 66
          assert len(set(observed)) == 66 and set(observed) == set(keys)
          assert output['runtime_order_sha256'] == hashlib.sha256(
              ('\n'.join(observed) + '\n').encode()
          ).hexdigest()
          print('Official live Config biome ordinal observation is internally consistent.')
          print('Loaded registry independent ID oracle and source/SEM admission: STILL PENDING.')
          PY
